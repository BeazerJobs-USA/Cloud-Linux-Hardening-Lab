name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        run: bash -n scripts/validate-host.sh

      - name: Confirm required documentation
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f docs/architecture.md
          test -f docs/decision-log.md
          test -f docs/monitoring-validation.md
          test -f evidence/validation-evidence.md
          test -f configs/99-security-hardening.conf
          test -f configs/99-ssh-security-hardening.conf
