<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" width="1600" height="880" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Cloud Linux Hardening Remediation Workflow</title>
  <desc id="wf-desc">Nine-stage engineering remediation workflow from baseline assessment and exposure identification through Tailscale cutover, OpenSSH and sysctl hardening, and Wazuh verification.</desc>
  <defs>
    <linearGradient id="wf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1C"/>
      <stop offset="100%" stop-color="#0D1628"/>
    </linearGradient>
    <marker id="wf-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="wf-arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1600" height="880" fill="url(#wf-bg)"/>
  <rect x="20" y="20" width="1560" height="840" rx="16" fill="none" stroke="#1E2F4B" stroke-width="1.5"/>

  <!-- Header -->
  <text x="56" y="72" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#F8FAFC">Remediation &amp; Verification Workflow</text>
  <text x="56" y="106" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#94A3B8">Structured progression designed to eliminate public SSH exposure without losing remote administration or monitoring</text>

  <!-- Phase Group Headers -->
  <rect x="56" y="136" width="1488" height="36" rx="8" fill="#111C31" stroke="#223554" stroke-width="1"/>
  <text x="76" y="159" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#7DD3FC">PHASE 1: DISCOVERY &amp; PRIVATE CUTOVER (STAGES 1–3)   →   PHASE 2: FIREWALL &amp; SSH HARDENING (STAGES 4–6)   →   PHASE 3: KERNEL &amp; VERIFICATION (STAGES 7–9)</text>

  <!-- ROW 1: STAGES 1, 2, 3 -->
  <!-- Stage 1 -->
  <g transform="translate(56, 194)">
    <rect x="0" y="0" width="460" height="162" rx="12" fill="#121E34" stroke="#2D4A76" stroke-width="1.6"/>
    <rect x="20" y="18" width="38" height="30" rx="6" fill="#0F2C4C" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="39" y="39" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#38BDF8">01</text>
    <text x="70" y="40" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Baseline Assessment</text>
    <rect x="358" y="20" width="84" height="22" rx="5" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="400" y="35" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#6EE7B7">VERIFIED</text>
    <text x="20" y="76" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.5" fill="#CBD5E1">• Confirmed key-only SSH (root/password disabled)</text>
    <text x="20" y="102" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.5" fill="#CBD5E1">• Checked Fail2ban sshd jail &amp; 7 auditd watches</text>
    <text x="20" y="128" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.5" fill="#CBD5E1">• Verified all 5 security services active</text>
  </g>

  <line x1="516" y1="275" x2="562" y2="275" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#wf-arr)"/>

  <!-- Stage 2 -->
  <g transform="translate(570, 194)">
    <rect x="0" y="0" width="460" height="162" rx="12" fill="#1A1728" stroke="#EF4444" stroke-width="1.6"/>
    <rect x="20" y="18" width="38" height="30" rx="6" fill="#3A1523" stroke="#EF4444" stroke-width="1.2"/>
    <text x="39" y="39" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#FCA5A5">02</text>
    <text x="70" y="40" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">SSH Exposure Identification</text>
    <rect x="358" y="20" width="84" height="22" rx="5" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="400" y="35" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#6EE7B7">VERIFIED</text>
    <text x="20" y="76" font-family="Consolas, monospace" font-size="14.5" fill="#FCA5A5">• UFW allowed 22/tcp &amp; 22/tcp (v6) from Anywhere</text>
    <text x="20" y="102" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.5" fill="#CBD5E1">• ss -tulpn confirmed sshd listening on 0.0.0.0:22</text>
    <text x="20" y="128" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.5" fill="#CBD5E1">• Noted XRDP already scoped to tailscale0</text>
  </g>

  <line x1="1030" y1="275" x2="1076" y2="275" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#wf-arr)"/>

  <!-- Stage 3 -->
  <g transform="translate(1084, 194)">
    <rect x="0" y="0" width="460" height="162" rx="12" fill="#10213A" stroke="#0EA5E9" stroke-width="1.6"/>
    <rect x="20" y="18" width="38" height="30" rx="6" fill="#0F2C4C" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="39" y="39" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#38BDF8">03</text>
    <text x="70" y="40" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Tailscale Private Access</text>
    <rect x="358" y="20" width="84" height="22" rx="5" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="400" y="35" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#6EE7B7">VERIFIED</text>
    <text x="20" y="76" font-family="Consolas, monospace" font-size="14" fill="#7DD3FC">• ufw allow in on tailscale0 to any port 22</text>
    <text x="20" y="102" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.5" fill="#CBD5E1">• Opened &amp; verified second Tailscale SSH session</text>
    <text x="20" y="128" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.5" fill="#CBD5E1">• Kept cloud provider console ready as fallback</text>
  </g>

  <!-- Connector Row 1 -> Row 2 -->
  <path d="M 1314 356 L 1314 374 L 286 374 L 286 392" fill="none" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#wf-arr)"/>

  <!-- ROW 2: STAGES 4, 5, 6 -->
  <!-- Stage 4 -->
  <g transform="translate(56, 400)">
    <rect x="0" y="0" width="460" height="162" rx="12" fill="#10213A" stroke="#0EA5E9" stroke-width="1.6"/>
    <rect x="20" y="18" width="38" height="30" rx="6" fill="#0F2C4C" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="39" y="39" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#38BDF8">04</text>
    <text x="70" y="40" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">UFW Firewall Restrictions</text>
    <rect x="358" y="20" width="84" height="22" rx="5" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="400" y="35" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#6EE7B7">VERIFIED</text>
    <text x="20" y="76" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.5" fill="#CBD5E1">• Deleted generic IPv4 &amp; IPv6 22/tcp UFW rules</text>
    <text x="20" y="102" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.5" fill="#CBD5E1">• Rechecked numbering between deletions</text>
    <text x="20" y="128" font-family="Consolas, monospace" font-size="14.5" fill="#6EE7B7">• Confirmed Default: deny (incoming) verbose</text>
  </g>

  <line x1="516" y1="481" x2="562" y2="481" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#wf-arr)"/>

  <!-- Stage 5 -->
  <g transform="translate(570, 400)">
    <rect x="0" y="0" width="460" height="162" rx="12" fill="#10252C" stroke="#10B981" stroke-width="1.6"/>
    <rect x="20" y="18" width="38" height="30" rx="6" fill="#0B3B31" stroke="#10B981" stroke-width="1.2"/>
    <text x="39" y="39" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#6EE7B7">05</text>
    <text x="70" y="40" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">OpenSSH Hardening</text>
    <rect x="358" y="20" width="84" height="22" rx="5" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="400" y="35" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#6EE7B7">VERIFIED</text>
    <text x="20" y="76" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.5" fill="#CBD5E1">• Backed up /etc/ssh before creating drop-in</text>
    <text x="20" y="102" font-family="Consolas, monospace" font-size="14" fill="#6EE7B7">• MaxAuthTries 3 · MaxSessions 2 · Fwd no · VERBOSE</text>
    <text x="20" y="128" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.5" fill="#CBD5E1">• Validated syntax (sshd -t) &amp; reloaded ssh</text>
  </g>

  <line x1="1030" y1="481" x2="1076" y2="481" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#wf-arr)"/>

  <!-- Stage 6 -->
  <g transform="translate(1084, 400)">
    <rect x="0" y="0" width="460" height="162" rx="12" fill="#1C1E2E" stroke="#F59E0B" stroke-width="1.6"/>
    <rect x="20" y="18" width="38" height="30" rx="6" fill="#3B2B11" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="39" y="39" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#FBBF24">06</text>
    <text x="70" y="40" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Lynis Security Auditing</text>
    <rect x="342" y="20" width="100" height="22" rx="5" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <text x="392" y="35" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#CBD5E1">DOCUMENTED</text>
    <text x="20" y="76" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.5" fill="#CBD5E1">• Baseline 261 tests: Hardening Index 69 → 73 (SSH)</text>
    <text x="20" y="102" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.5" fill="#CBD5E1">• Reviewed KRNL-6000 sysctl suggestions</text>
    <text x="20" y="128" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" fill="#FDE68A">• Treated as advisory (Ubuntu 26.04 EOL DB gap)</text>
  </g>

  <!-- Connector Row 2 -> Row 3 -->
  <path d="M 1314 562 L 1314 580 L 286 580 L 286 598" fill="none" stroke="#10B981" stroke-width="2.2" marker-end="url(#wf-arr-green)"/>

  <!-- ROW 3: STAGES 7, 8, 9 -->
  <!-- Stage 7 -->
  <g transform="translate(56, 606)">
    <rect x="0" y="0" width="460" height="162" rx="12" fill="#10252C" stroke="#10B981" stroke-width="1.6"/>
    <rect x="20" y="18" width="38" height="30" rx="6" fill="#0B3B31" stroke="#10B981" stroke-width="1.2"/>
    <text x="39" y="39" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#6EE7B7">07</text>
    <text x="70" y="40" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Kernel &amp; Network Hardening</text>
    <rect x="358" y="20" width="84" height="22" rx="5" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="400" y="35" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#6EE7B7">VERIFIED</text>
    <text x="20" y="76" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.5" fill="#CBD5E1">• Applied 99-security-hardening.conf via sysctl</text>
    <text x="20" y="102" font-family="Consolas, monospace" font-size="14" fill="#6EE7B7">• kptr_restrict=2 · suid_dumpable=0 · log_martians=1</text>
    <text x="20" y="128" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" fill="#FDE68A">• Documented 3 exceptions (incl. rp_filter=2)</text>
  </g>

  <line x1="516" y1="687" x2="562" y2="687" stroke="#10B981" stroke-width="2.5" marker-end="url(#wf-arr-green)"/>

  <!-- Stage 8 -->
  <g transform="translate(570, 606)">
    <rect x="0" y="0" width="460" height="162" rx="12" fill="#10252C" stroke="#10B981" stroke-width="1.6"/>
    <rect x="20" y="18" width="38" height="30" rx="6" fill="#0B3B31" stroke="#10B981" stroke-width="1.2"/>
    <text x="39" y="39" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#6EE7B7">08</text>
    <text x="70" y="40" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Access &amp; Service Validation</text>
    <rect x="358" y="20" width="84" height="22" rx="5" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="400" y="35" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#6EE7B7">VERIFIED</text>
    <text x="20" y="76" font-family="Consolas, monospace" font-size="14" fill="#6EE7B7">• Test-NetConnection: Tailscale=True, Public=False</text>
    <text x="20" y="102" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.5" fill="#CBD5E1">• Confirmed ssh, tailscaled, fail2ban, auditd, wazuh</text>
    <text x="20" y="128" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.5" fill="#CBD5E1">• Tested new SSH login after kernel changes</text>
  </g>

  <line x1="1030" y1="687" x2="1076" y2="687" stroke="#10B981" stroke-width="2.5" marker-end="url(#wf-arr-green)"/>

  <!-- Stage 9 -->
  <g transform="translate(1084, 606)">
    <rect x="0" y="0" width="460" height="162" rx="12" fill="#171632" stroke="#8B5CF6" stroke-width="1.6"/>
    <rect x="20" y="18" width="38" height="30" rx="6" fill="#2A2356" stroke="#A78BFA" stroke-width="1.2"/>
    <text x="39" y="39" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#DDD6FE">09</text>
    <text x="70" y="40" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#F8FAFC">Wazuh Verification</text>
    <rect x="358" y="20" width="84" height="22" rx="5" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="400" y="35" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#6EE7B7">VERIFIED</text>
    <text x="20" y="76" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.5" fill="#CBD5E1">• Confirmed active endpoint (vultr-security-lab)</text>
    <text x="20" y="102" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.5" fill="#CBD5E1">• Rule 100100 recorded SSH config changes (16)</text>
    <text x="20" y="128" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.5" fill="#DDD6FE">• SCA verified LogLevel failed → passed</text>
  </g>

  <!-- Change Safety Bar -->
  <rect x="56" y="794" width="1488" height="44" rx="10" fill="#111C31" stroke="#24385A" stroke-width="1.2"/>
  <text x="76" y="821" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">Change Safety Controls:</text>
  <text x="268" y="821" font-family="Consolas, monospace" font-size="14" fill="#94A3B8">Backup /etc/ssh &amp; /etc/sysctl* before editing  •  Validate syntax (sshd -t)  •  Keep active recovery session &amp; cloud console fallback</text>
</svg>
