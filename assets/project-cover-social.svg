<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="social-cover-title social-cover-desc">
  <title id="social-cover-title">Cloud Linux Hardening Lab</title>
  <desc id="social-cover-desc">Social preview banner for Cloud Linux Hardening Lab illustrating Ubuntu cloud VM hardening with Tailscale private SSH access, UFW restriction, OpenSSH hardening, kernel sysctl controls, and Wazuh monitoring.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D19"/>
      <stop offset="55%" stop-color="#0B1324"/>
      <stop offset="100%" stop-color="#0E1A30"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#0EA5E9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#132038" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0E1729" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="subtle-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="640" fill="url(#bg-grad)"/>
  <rect width="1280" height="640" fill="url(#subtle-grid)"/>

  <!-- Top Structural Rule & Inner Safe Border -->
  <rect x="0" y="0" width="1280" height="5" fill="#0EA5E9"/>
  <rect x="48" y="42" width="1184" height="556" rx="18" fill="none" stroke="#1E304D" stroke-width="1.5"/>

  <!-- Left Column: Title, Summary, Metadata Chips -->
  <g id="social-hero-copy">
    <rect x="88" y="88" width="528" height="36" rx="18" fill="#0F233D" stroke="#1E4B78" stroke-width="1.4"/>
    <circle cx="110" cy="106" r="5" fill="#38BDF8"/>
    <text x="126" y="111" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.2" fill="#7DD3FC">UBUNTU CLOUD SECURITY  •  PRIVATE ACCESS LAB</text>

    <text x="88" y="196" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="62" font-weight="700" fill="#F8FAFC" letter-spacing="-0.8">Cloud Linux</text>
    <text x="88" y="266" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="62" font-weight="700" fill="#38BDF8" letter-spacing="-0.8">Hardening Lab</text>

    <rect x="88" y="294" width="430" height="4" rx="2" fill="url(#accent-line)"/>

    <text x="88" y="346" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" font-weight="400" fill="#CBD5E1">Eliminating public SSH exposure on an Ubuntu</text>
    <text x="88" y="378" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" font-weight="400" fill="#CBD5E1">cloud VM with Tailscale, UFW, OpenSSH,</text>
    <text x="88" y="410" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" font-weight="400" fill="#CBD5E1">kernel sysctl tuning, and Wazuh telemetry.</text>

    <g id="social-meta-chips" transform="translate(88, 452)">
      <rect x="0" y="0" width="166" height="40" rx="8" fill="#13223B" stroke="#263B5E" stroke-width="1.2"/>
      <text x="14" y="25" font-family="Consolas, monospace" font-size="15" fill="#94A3B8">OS: <tspan fill="#E2E8F0" font-weight="700">Ubuntu 26.04</tspan></text>

      <rect x="178" y="0" width="188" height="40" rx="8" fill="#13223B" stroke="#263B5E" stroke-width="1.2"/>
      <text x="192" y="25" font-family="Consolas, monospace" font-size="15" fill="#94A3B8">Access: <tspan fill="#38BDF8" font-weight="700">tailscale0</tspan></text>

      <rect x="378" y="0" width="168" height="40" rx="8" fill="#13223B" stroke="#263B5E" stroke-width="1.2"/>
      <text x="392" y="25" font-family="Consolas, monospace" font-size="15" fill="#94A3B8">Lynis: <tspan fill="#10B981" font-weight="700">69 → 73</tspan></text>
    </g>

    <text x="88" y="542" font-family="Consolas, monospace" font-size="14" fill="#64748B">UFW  ·  OpenSSH  ·  Tailscale  ·  Fail2ban  ·  auditd  ·  sysctl  ·  Wazuh</text>
  </g>

  <!-- Right Column: Security Boundary Schematic -->
  <g id="social-cover-schematic" transform="translate(676, 84)">
    <rect x="0" y="0" width="516" height="472" rx="16" fill="url(#card-grad)" stroke="#243857" stroke-width="1.5"/>
    <text x="24" y="34" font-family="Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1.1" fill="#64748B">BOUNDARY MODEL  //  PRIVATE ACCESS</text>
    <line x1="24" y1="50" x2="492" y2="50" stroke="#1E304D" stroke-width="1"/>

    <!-- Node 1: Public Internet -->
    <rect x="24" y="72" width="184" height="114" rx="11" fill="#1A1523" stroke="#7F1D1D" stroke-width="1.4"/>
    <circle cx="46" cy="100" r="9" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1.4"/>
    <path d="M 42 96 L 50 104 M 50 96 L 42 104" stroke="#EF4444" stroke-width="1.8" stroke-linecap="round"/>
    <text x="64" y="105" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#FCA5A5">Public Internet</text>
    <text x="40" y="136" font-family="Consolas, monospace" font-size="13.5" fill="#CBD5E1">TCP/22 Direct Path</text>
    <text x="40" y="162" font-family="Consolas, monospace" font-size="13.5" font-weight="700" fill="#F87171">STATUS: BLOCKED</text>

    <!-- Node 2: Tailscale Admin Path -->
    <rect x="24" y="210" width="184" height="136" rx="11" fill="#0F253E" stroke="#0284C7" stroke-width="1.6"/>
    <rect x="38" y="232" width="18" height="13" rx="2.5" fill="none" stroke="#38BDF8" stroke-width="1.8"/>
    <line x1="42" y1="250" x2="52" y2="250" stroke="#38BDF8" stroke-width="1.8"/>
    <text x="64" y="244" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#F8FAFC">Workstation</text>
    <text x="40" y="276" font-family="Consolas, monospace" font-size="13.5" fill="#7DD3FC">IF: tailscale0</text>
    <text x="40" y="300" font-family="Consolas, monospace" font-size="13.5" fill="#CBD5E1">Key-Only SSH :22</text>
    <text x="40" y="324" font-family="Consolas, monospace" font-size="13.5" font-weight="700" fill="#34D399">STATUS: VERIFIED</text>

    <!-- Arrows -->
    <line x1="208" y1="129" x2="246" y2="129" stroke="#EF4444" stroke-width="2" stroke-dasharray="5,5"/>
    <circle cx="240" cy="129" r="12" fill="#2A1219" stroke="#EF4444" stroke-width="1.8"/>
    <path d="M 235 124 L 245 134 M 245 124 L 235 134" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>

    <line x1="208" y1="278" x2="258" y2="278" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrow-cyan)"/>

    <!-- Node 3: Hardened Ubuntu Host -->
    <rect x="266" y="72" width="226" height="274" rx="12" fill="#101D33" stroke="#38BDF8" stroke-width="1.6"/>
    <path d="M 294 94 L 305 99 L 305 110 C 305 117 299 122 294 124 C 289 122 283 117 283 110 L 283 99 Z" fill="#0EA5E9" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1.8"/>
    <text x="316" y="114" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">Ubuntu Cloud Host</text>

    <rect x="282" y="136" width="194" height="40" rx="7" fill="#162642" stroke="#253E66" stroke-width="1"/>
    <text x="294" y="161" font-family="Consolas, monospace" font-size="13.5" fill="#E2E8F0">UFW: <tspan fill="#38BDF8">deny + tailscale0</tspan></text>

    <rect x="282" y="186" width="194" height="40" rx="7" fill="#162642" stroke="#253E66" stroke-width="1"/>
    <text x="294" y="211" font-family="Consolas, monospace" font-size="13.5" fill="#E2E8F0">SSH: <tspan fill="#34D399">MaxAuth 3 · VERBOSE</tspan></text>

    <rect x="282" y="236" width="194" height="40" rx="7" fill="#162642" stroke="#253E66" stroke-width="1"/>
    <text x="294" y="261" font-family="Consolas, monospace" font-size="13.5" fill="#E2E8F0">Kernel: <tspan fill="#FBBF24">sysctl</tspan> + <tspan fill="#FBBF24">F2B</tspan></text>

    <rect x="282" y="286" width="194" height="38" rx="7" fill="#0E2924" stroke="#10B981" stroke-width="1"/>
    <text x="294" y="310" font-family="Consolas, monospace" font-size="13.5" fill="#6EE7B7">auditd: 7 watch rules</text>

    <!-- Bottom Telemetry Box -->
    <line x1="379" y1="346" x2="379" y2="376" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>
    <rect x="24" y="380" width="468" height="68" rx="10" fill="#121E34" stroke="#2A4268" stroke-width="1.2"/>
    <circle cx="48" cy="414" r="6" fill="#10B981"/>
    <text x="64" y="408" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#F8FAFC">Wazuh Telemetry &amp; SCA Visibility</text>
    <text x="64" y="432" font-family="Consolas, monospace" font-size="13" fill="#94A3B8">Agent Active (1)  |  Rule 100100  |  SCA LogLevel Passed</text>
  </g>
</svg>
